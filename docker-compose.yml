version: "3.9"

services:
  # ─────────────────────────────────────────
  # POSTGRESQL (Ana ilişkisel DB + RLS)
  # ─────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: proptech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proptech}
      POSTGRES_USER: ${POSTGRES_USER:-proptech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proptech}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # REDIS (Cache + Kuyruk)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: proptech_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # BACKEND (FastAPI)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proptech_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-proptech}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-proptech}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # CELERY WORKER (Arka Plan Görevleri)
  # ─────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proptech_celery
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-proptech}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-proptech}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      - backend
      - redis
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # CELERY BEAT (Zamanlı Görevler)
  # ─────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proptech_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-proptech}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-proptech}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - celery_worker
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # SCRAPER SERVİSİ
  # ─────────────────────────────────────────
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: proptech_scraper
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      BACKEND_URL: http://backend:8000
    volumes:
      - ./scraper:/app
      - media_data:/app/media
    depends_on:
      - backend
      - redis
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # AI ENGINE (Yapay Zeka Motoru)
  # ─────────────────────────────────────────
  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: proptech_ai
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-proptech}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-proptech}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - ./ai_engine:/app
      - media_data:/app/media
      - ai_models:/app/models
    depends_on:
      - backend
      - redis
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # ELASTICSEARCH (Full-text Arama)
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: proptech_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # FRONTEND (Next.js)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: proptech_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # NGINX (Reverse Proxy + SSL)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: proptech_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - media_data:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - proptech_net

  # ─────────────────────────────────────────
  # CERTBOT (SSL Sertifika)
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: proptech_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  media_data:
  ai_models:
  elasticsearch_data:
  certbot_data:
  certbot_www:

networks:
  proptech_net:
    driver: bridge
