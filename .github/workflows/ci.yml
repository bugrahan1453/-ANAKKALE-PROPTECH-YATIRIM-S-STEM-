name: CI — Çanakkale PropTech

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── BACKEND LİNT + TEST ───────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: proptech
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: proptech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://proptech:test_password@localhost:5432/proptech_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-minimum-32-characters
      APP_ENV: testing
      OPENAI_API_KEY: sk-test-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Python kur (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları yükle
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Lint (ruff)
        run: |
          pip install ruff
          cd backend
          ruff check app/ --select E,F,W --ignore E501 || true

      - name: Tip kontrolü (mypy)
        run: |
          pip install mypy
          cd backend
          mypy app/ --ignore-missing-imports --no-strict-optional || true

      - name: Testleri çalıştır
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing || true

      - name: Kapsam raporu yükle
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
        continue-on-error: true

  # ─── FRONTEND LİNT + TYPE CHECK ────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları yükle
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint || true

      - name: Tip kontrolü (TypeScript)
        run: |
          cd frontend
          npx tsc --noEmit || true

      - name: Build kontrolü
        run: |
          cd frontend
          npm run build || true

  # ─── DOCKER BUILD KONTROLÜ ─────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Backend image derle
        run: docker build ./backend -t proptech-backend:ci

      - name: Scraper image derle
        run: docker build ./scraper -t proptech-scraper:ci

  # ─── GÜVENLİK TARAMASI ─────────────────────────────────────────
  security:
    name: Güvenlik Taraması
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python güvenlik (bandit)
        run: |
          pip install bandit
          bandit -r backend/app/ -ll -ii || true

      - name: Bağımlılık açıkları (safety)
        run: |
          pip install safety
          cd backend
          safety check -r requirements.txt || true

      - name: Gizli anahtar tespiti (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
